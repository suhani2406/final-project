<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta
      name="theme-color"
      content="#f4f1ec"
    />

    <meta
      name="description"
      content="YumeNote - Beautiful Productivity Notes App"
    />

    <!-- 🌸 GOOGLE FONT -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>YumeNote ✨</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        background: #f4f1ec;
        overflow-x: hidden;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: #f4f1ec;
      }

      ::-webkit-scrollbar-thumb {
        background: #d8cfc4;
        border-radius: 10px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #c5b8aa;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="root"></div>
  </body>
</html>
